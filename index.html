<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumbo móvil — Próximamente</title>
<meta name="description" content="Rumbo móvil: viajes en auto con conductores independientes. Muy pronto.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<style>
  :root{--petroleo:#11304A;--turquesa:#14B8C4;--fondo:#F6FAFB;--gris:#4E5A6C}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--fondo);color:var(--petroleo);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
  .logo{width:min(320px,70vw);height:auto}
  h1{font-size:clamp(26px,5vw,38px);margin:28px 0 8px;font-weight:700}
  p{margin:0 0 6px;color:var(--gris);max-width:30em}
  .pill{display:inline-block;margin-top:22px;padding:8px 18px;border-radius:999px;background:var(--turquesa);color:#fff;font-weight:600;font-size:15px}
  .contacto{margin-top:26px;font-size:16px}
  a{color:var(--petroleo);text-decoration-color:var(--turquesa);text-underline-offset:3px}
  footer{padding:20px 24px 28px;display:flex;justify-content:center}
  .by{display:flex;align-items:center;gap:.5em}
  .by span{font:400 16px system-ui,sans-serif;color:var(--gris)}
  .by img{height:40px;width:auto}
</style>
</head>
<body>
<main>
  <img class="logo" src="rumbo-logo.png" alt="Rumbo móvil">
  <h1>Muy pronto</h1>
  <p>Estamos preparando Rumbo móvil: viajes en auto con conductores independientes.</p>
  <span class="pill">Próximamente</span>
  <p class="contacto">Escríbenos a <a href="mailto:contacto@rumbomovil.cl">contacto@rumbomovil.cl</a></p>
</main>
<footer>
  <div class="by"><span>by</span><img src="bto-logo.png" alt="BTo Innova soluciones"></div>
</footer>
</body>
</html>
